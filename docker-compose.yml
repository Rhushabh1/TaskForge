services:
  api:
    build: .
    container_name: taskforge_api
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: postgres:16
    container_name: taskforge-db
    restart: always
    env_file:
      - .env
    ports:
      - "1234:1234"
    volumes: 
      - postgres-data:/var/lib/postgresql/data 

  volumes:
    postgres-data: