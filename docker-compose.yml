services:
  # all separate services are listed separately here as well
  api:
    build: .
    container_name: taskforge_api
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    depends_on:
      - db
      - kafka
    env_file:
      - .env

  db:
    image: postgres:16
    container_name: taskforge-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes: 
      - postgres-data:/var/lib/postgresql/data 

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7
    container_name: taskforge-redis
    ports: 
      - "6379:6379"

volumes:
  postgres-data: